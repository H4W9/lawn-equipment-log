<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="1.1.0"><!-- bump this when cutting a release; CI also stamps the tag into the release asset -->
<meta name="theme-color" content="#2d6a37">
<title>Lawn Equipment Log</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column (list -> unit detail), sheets slide up for forms; hour-meter readouts as the signature detail */
:root{
  --bg:#eef0ea; --surface:#fbfcf9; --sunk:#e4e8de; --ink:#1b221c; --muted:#5b665c; --line:#d3d9cc;
  --accent:#2d6a37; --accent-ink:#ffffff; --accent-soft:#dbe8d6;
  --meter-bg:#1d241e; --meter-ink:#d9f2c4;
  --ok:#2c7442; --ok-bg:#dcefe0; --warn:#9a5a06; --warn-bg:#f8e7c8; --bad:#a8231b; --bad-bg:#f8dcd8; --none:#5b665c; --none-bg:#e4e8de;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121612; --surface:#1a201b; --sunk:#232a24; --ink:#e3e9e0; --muted:#9aa69a; --line:#2e372f;
  --accent:#7cc487; --accent-ink:#0e1a10; --accent-soft:#233a27;
  --meter-bg:#0b0e0b; --meter-ink:#bfeaa6;
  --ok:#86d29a; --ok-bg:#1e3524; --warn:#eab063; --warn-bg:#3a2c14; --bad:#f2847a; --bad-bg:#3d1c19; --none:#9aa69a; --none-bg:#262d27;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121612; --surface:#1a201b; --sunk:#232a24; --ink:#e3e9e0; --muted:#9aa69a; --line:#2e372f;
  --accent:#7cc487; --accent-ink:#0e1a10; --accent-soft:#233a27;
  --meter-bg:#0b0e0b; --meter-ink:#bfeaa6;
  --ok:#86d29a; --ok-bg:#1e3524; --warn:#eab063; --warn-bg:#3a2c14; --bad:#f2847a; --bad-bg:#3d1c19; --none:#9aa69a; --none-bg:#262d27;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;font-weight:700;line-height:1.05}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--display);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{padding:6px 10px;min-height:32px;font-size:.85rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

#main,#notices{display:flex;flex-direction:column;gap:14px;min-width:0}
#notices{gap:8px}
#notices:empty{display:none}
.notice{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.notice.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}

.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.tally div{padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tally div+div{border-left:1px solid var(--line)}
.tally b{font-family:var(--mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.tally .bad b{color:var(--bad)} .tally .warn b{color:var(--warn)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;border-left:5px solid var(--st,var(--line))}
.unit:hover{border-color:var(--muted);border-left-color:var(--st,var(--muted))}
.unit .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.unit .sub{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.unit .due{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.st-overdue{--st:var(--bad)} .st-soon{--st:var(--warn)} .st-ok{--st:var(--ok)} .st-none{--st:var(--line)}

.meter{display:inline-flex;align-items:baseline;gap:4px;background:var(--meter-bg);color:var(--meter-ink);font-family:var(--mono);font-variant-numeric:tabular-nums;border-radius:6px;padding:5px 9px;font-size:1.05rem;letter-spacing:.04em;align-self:start;white-space:nowrap}
.meter small{font-size:.7rem;opacity:.75;letter-spacing:.06em}
.meter.big{font-size:1.7rem;padding:8px 12px}
.meter.date{font-size:.95rem}
.meter.big.date{font-size:1.25rem}
#eq-form.nometer .f-hours-wrap,#eq-form.nometer .iv-h,#eq-form.nometer .iv-head span:nth-child(2){display:none}
#eq-form.nometer .iv-row{grid-template-columns:minmax(0,1fr) 5.5em 36px}
.checkrow{display:flex;gap:10px;align-items:center;font-weight:500}
.checkrow input{width:18px;height:18px;accent-color:var(--accent)}

.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.chip.overdue{background:var(--bad-bg);color:var(--bad)}
.chip.soon{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.none{background:var(--none-bg);color:var(--none)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}

.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* detail */
.back{align-self:flex-start}
.dhead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.dhead .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.dhead h1{overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hours-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hours-row input{width:9em;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-family:var(--mono)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-family:var(--display);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px;margin:0}
.specs div{min-width:0;display:flex;flex-direction:column;gap:1px}
.specs dt{font-family:var(--display);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.specs dd{margin:0;overflow-wrap:anywhere}
.specs dd.mono{font-size:.92rem}
.notes{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.log{display:flex;flex-direction:column}
.log li{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log ul{margin:0;padding:0}
.log .what{font-weight:600}
.log .meta{color:var(--muted);font-size:.85rem;font-family:var(--mono)}
.log .extra{grid-column:1/-1;font-size:.88rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:var(--muted)}
footer{margin-top:8px;color:var(--muted);font-size:12px;text-align:center}
footer a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
footer a:hover{filter:brightness(1.15)}
#appVersion{font-variant-numeric:tabular-nums}
.gh-ico{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,10,.5);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:760px){.backdrop{align-items:center}.sheet{border-radius:14px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--sunk);border-radius:8px;width:36px;height:36px;font-size:1.2rem;line-height:1}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{padding:0;margin-bottom:8px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.82rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field.wide{grid-column:1/-1}
.iv-row{display:grid;grid-template-columns:minmax(0,1fr) 5.5em 5.5em 36px;gap:6px;align-items:center}
.iv-row input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.iv-head{font-size:.75rem;color:var(--muted);font-weight:500}
.iv-del{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-24px;background:var(--surface);padding-block:10px 0}
textarea.json{width:100%;min-height:120px;font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}
.status-msg{font-size:.9rem;font-weight:500}
.status-msg.good{color:var(--ok)} .status-msg.badmsg{color:var(--bad)}
.radio{display:flex;gap:14px;flex-wrap:wrap}
.radio label{display:flex;gap:6px;align-items:center}
@media (max-width:480px){.tally b{font-size:1.25rem}.iv-row{grid-template-columns:minmax(0,1fr) 4.4em 4.4em 34px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Lawn Equipment Log</h1>
      <p>Saved in this browser on this device. Use Backup to move it.</p>
    </div>
    <div class="actions">
      <button class="btn" id="btn-backup" type="button">Backup &amp; restore</button>
      <button class="btn primary" id="btn-add" type="button">+ Add equipment</button>
    </div>
  </header>
  <div id="notices"></div>
  <main id="main"></main>
  <footer>
    <div>Lawn Equipment Log <span id="appVersion">v1.1.0</span> &middot; <a href="https://github.com/H4W9/lawn-equipment-log/releases/latest/download/lawn-equipment-log.html">Download latest release</a> &middot; <a href="https://github.com/H4W9/lawn-equipment-log"><svg class="gh-ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Source</a></div>
  </footer>
</div>
<div class="backdrop" id="backdrop" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const KEY='lawnEquipLog.v1';
const TYPES=['Riding mower','Zero-turn mower','Push mower','String trimmer','Edger','Leaf blower','Chainsaw','Hedge trimmer','Tiller','Snow blower','Other'];
const TEMPLATES={
  'Riding mower':[['Engine oil & filter',50,365],['Air filter clean/replace',25,null],['Spark plug(s)',100,365],['Sharpen blades',25,null],['Grease fittings',25,null],['Fuel filter',100,365],['Check belts & tire pressure',null,90]],
  'Zero-turn mower':[['Engine oil & filter',100,365],['Air filter',50,null],['Hydro oil & filters',400,null],['Sharpen blades',25,null],['Grease fittings',25,null],['Spark plugs',200,365]],
  'Push mower':[['Change oil',50,365],['Air filter',25,365],['Spark plug',100,365],['Sharpen blade',25,null]],
  'String trimmer':[['Clean air filter',10,null],['Spark plug',100,365],['Fuel filter',null,365],['Grease gearhead',25,null]],
  'Edger':[['Clean air filter',10,null],['Spark plug',100,365],['Replace blade',25,null]],
  'Leaf blower':[['Clean air filter',25,null],['Spark plug',100,365],['Fuel filter',null,365]],
  'Chainsaw':[['Sharpen chain',5,null],['Clean air filter',10,null],['Flip & clean bar',10,null],['Spark plug',100,365]],
  'Hedge trimmer':[['Clean air filter',10,null],['Lubricate blades',10,null],['Spark plug',100,365]],
  'Tiller':[['Change oil',50,365],['Air filter',25,null],['Spark plug',100,365]],
  'Snow blower':[['Change oil',null,365],['Spark plug',100,365],['Check shear pins & belts',null,365]],
  'Other':[]
};
const NO_METER=['Push mower','String trimmer','Edger','Leaf blower','Chainsaw','Hedge trimmer','Tiller','Snow blower','Other'];
const DATE_TEMPLATES={
  'Push mower':[['Change oil',null,365],['Air filter',null,365],['Spark plug',null,365],['Sharpen blade',null,180]],
  'String trimmer':[['Clean air filter',null,90],['Spark plug',null,365],['Fuel filter',null,365],['Grease gearhead',null,180]],
  'Edger':[['Clean air filter',null,90],['Spark plug',null,365],['Replace blade',null,180]],
  'Leaf blower':[['Clean air filter',null,90],['Spark plug',null,365],['Fuel filter',null,365]],
  'Chainsaw':[['Sharpen chain',null,30],['Clean air filter',null,30],['Flip & clean bar',null,30],['Spark plug',null,365]],
  'Hedge trimmer':[['Clean air filter',null,90],['Lubricate blades',null,30],['Spark plug',null,365]],
  'Tiller':[['Change oil',null,365],['Air filter',null,365],['Spark plug',null,365]],
  'Snow blower':[['Change oil',null,365],['Spark plug',null,365],['Check shear pins & belts',null,365]],
  'Riding mower':[['Engine oil & filter',null,365],['Air filter',null,180],['Spark plug(s)',null,365],['Sharpen blades',null,90],['Grease fittings',null,90]],
  'Zero-turn mower':[['Engine oil & filter',null,365],['Air filter',null,180],['Sharpen blades',null,90],['Grease fittings',null,90],['Spark plugs',null,365]],
  'Other':[]
};
const hasMeter=e=>e&&e.meter!==undefined?!!e.meter:!NO_METER.includes(e&&e.type);
const ivHint=m=>m?'Set hours, days, or both. Whichever comes first triggers "due".':'Set how many days between each service.';
const template=(type,meter)=>((meter?TEMPLATES:DATE_TEMPLATES)[type]||[]);
let db={equipment:[],logs:[],examples:false};
let storageOK=true;
const view={mode:'list',id:null,q:'',type:'All'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>iso(new Date());
const addDays=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n));};
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5;};
const daysBetween=(a,b)=>Math.round(dayNum(b)-dayNum(a));
const fmtDate=s=>{if(!s)return '—';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});};
const fmtH=n=>(n==null||n===''||isNaN(n))?'—':(+n).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
const num=v=>{if(v==null)return null;v=String(v).trim();if(v==='')return null;const n=parseFloat(v);return isNaN(n)?null:n;};
const meterTxt=n=>{n=+n||0;const s=n.toFixed(1);return s.padStart(6,'0');};

/* ---------- storage ---------- */
function normalize(o){
  const out={equipment:Array.isArray(o.equipment)?o.equipment:[],logs:Array.isArray(o.logs)?o.logs:[],examples:!!o.examples};
  out.equipment.forEach(e=>{if(!e.id)e.id=uid();if(!Array.isArray(e.intervals))e.intervals=[];e.intervals.forEach(i=>{if(!i.id)i.id=uid();});});
  out.logs.forEach(l=>{if(!l.id)l.id=uid();if(!Array.isArray(l.tasks))l.tasks=l.tasks?[String(l.tasks)]:[];});
  return out;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){db=normalize(JSON.parse(raw));return true;}}catch(e){storageOK=false;}
  return false;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;}
}

/* ---------- examples ---------- */
function seed(){
  const t=todayStr();
  const mk=(e)=>Object.assign({id:uid(),ex:true,intervals:[]},e);

/* ---------- status ---------- */
const RANK={overdue:3,soon:2,none:1,ok:0};
function ivStatus(eq,iv){
  const cur=+eq.hours||0, t=todayStr(), m=hasMeter(eq);
  let hrsLeft=null,daysLeft=null,dueH=null,dueD=null;
  const never=(!m||iv.lastHours==null)&&!iv.lastDate;
  if(never) return {state:'none',hrsLeft,daysLeft,dueH,dueD,text:'No service recorded'};
  if(m&&iv.everyHours&&iv.lastHours!=null){dueH=+iv.lastHours+ +iv.everyHours;hrsLeft=dueH-cur;}
  if(iv.everyDays&&iv.lastDate){dueD=addDays(iv.lastDate,+iv.everyDays);daysLeft=daysBetween(t,dueD);}
  let state='ok';
  if((hrsLeft!=null&&hrsLeft<=0)||(daysLeft!=null&&daysLeft<=0)) state='overdue';
  else if((hrsLeft!=null&&hrsLeft<=Math.max(2,iv.everyHours*0.1))||(daysLeft!=null&&daysLeft<=14)) state='soon';
  if(hrsLeft==null&&daysLeft==null) state='none';
  const parts=[];
  if(hrsLeft!=null) parts.push(hrsLeft<=0?`${fmtH(-hrsLeft)} h over`:`in ${fmtH(hrsLeft)} h`);
  if(daysLeft!=null) parts.push(daysLeft<=0?`${-daysLeft} d late`:`by ${fmtDate(dueD)}`);
  return {state,hrsLeft,daysLeft,dueH,dueD,text:parts.join(' · ')||'No interval set'};
}
function eqStatus(eq){
  let best=null;
  (eq.intervals||[]).forEach(iv=>{
    const s=ivStatus(eq,iv);s.task=iv.task;
    if(!best) {best=s;return;}
    if(RANK[s.state]>RANK[best.state]) best=s;
    else if(RANK[s.state]===RANK[best.state]){
      const a=s.hrsLeft??s.daysLeft??1e9, b=best.hrsLeft??best.daysLeft??1e9;
      if(a<b) best=s;
    }
  });
  return best||{state:'none',text:'No schedule set',task:''};
}
const stateLabel={overdue:'Overdue',soon:'Due soon',ok:'OK',none:'No record'};

function saveEquip(form){
  const v=id=>$('#'+id).value.trim();
  if(!v('f-name')){const m=$('#eq-err');m.textContent='Give it a name so you can find it in the list.';m.hidden=false;$('#f-name').focus();return;}
  const id=form.dataset.id;
  const existing=id?db.equipment.find(x=>x.id===id):null;
  const e=existing||{id:uid(),intervals:[]};
  const oldH=e.hours;
  Object.assign(e,{name:v('f-name'),type:$('#f-type').value,meter:$('#f-meter').checked,make:v('f-make'),model:v('f-model'),serial:v('f-serial'),year:v('f-year'),hours:num(v('f-hours'))??0,
    engineMake:v('f-engine'),engineSerial:v('f-eserial'),fuel:v('f-fuel'),oilType:v('f-oil'),oilCap:v('f-oilcap'),oilFilter:v('f-oilf'),plug:v('f-plug'),airFilter:v('f-air'),
    fuelFilter:v('f-fuelf'),blade:v('f-blade'),belt:v('f-belt'),tires:v('f-tires'),purchaseDate:v('f-pdate'),dealer:v('f-dealer'),price:v('f-price'),notes:$('#f-notes').value});
  if(oldH!==e.hours) e.hoursUpdated=todayStr();
  e.intervals=[...document.querySelectorAll('#iv-list .iv-row')].map(r=>({
    id:r.dataset.ivid||uid(),task:r.querySelector('.iv-task').value.trim(),everyHours:num(r.querySelector('.iv-h').value),everyDays:num(r.querySelector('.iv-d').value),
    lastHours:num(r.dataset.lh),lastDate:r.dataset.ld||null})).filter(i=>i.task);
  if(!existing) db.equipment.push(e);
  save();closeSheet();view.mode='detail';view.id=e.id;render();window.scrollTo(0,0);
}

function saveLog(form){
  const e=db.equipment.find(x=>x.id===form.dataset.id);
  const checked=[...form.querySelectorAll('input[name=iv]:checked')].map(c=>c.value);
  const other=$('#l-other').value.trim();
  const date=$('#l-date').value||todayStr(), hours=$('#l-hours')?num($('#l-hours').value):null;
  if(!checked.length&&!other){const m=$('#log-err');m.textContent='Check a task or describe the work under Other work.';m.hidden=false;return;}
  const tasks=checked.map(id=>e.intervals.find(i=>i.id===id).task); if(other) tasks.push(other);
  db.logs.push({id:uid(),equipId:e.id,date,hours,tasks,parts:$('#l-parts').value.trim(),cost:num($('#l-cost').value),notes:$('#l-notes').value.trim()});
  checked.forEach(id=>{const iv=e.intervals.find(i=>i.id===id);
    if(!iv.lastDate||date>=iv.lastDate){iv.lastDate=date;if(hours!=null)iv.lastHours=hours;}});
  if(hours!=null&&hours>(+e.hours||0)){e.hours=hours;e.hoursUpdated=date;}
  save();closeSheet();render();
}
function backupJSON(){return JSON.stringify({app:'lawn-equipment-log',version:1,exportedAt:new Date().toISOString(),equipment:db.equipment,logs:db.logs},null,2);}
function backupSheet(){
  openSheet(`${head('Backup &amp; restore')}
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Export</h3>
    <p class="muted" style="margin:0;font-size:.9rem">Save a backup file, or copy the text and paste it into a note, email or file. On the other device, open this tool and import it below.</p>
    <div class="actions"><button class="btn primary" type="button" data-act="download">Download backup file</button><button class="btn" type="button" data-act="copy">Copy backup text</button></div>
    <p class="status-msg" id="exp-msg" hidden></p>
    <textarea class="json" id="exp-text" readonly aria-label="Backup text">${esc(backupJSON())}</textarea>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Import</h3>
    <label class="field"><span>Choose a backup file (.json)</span><input id="imp-file" type="file" accept=".json,application/json,text/plain"></label>
    <label class="field"><span>…or paste backup text</span><textarea class="json" id="imp-text" placeholder='{"app":"lawn-equipment-log", …}'></textarea></label>
    <div class="radio" role="radiogroup" aria-label="Import mode"><label><input type="radio" name="imp-mode" id="imp-merge" value="merge" checked> Merge with what's here</label><label><input type="radio" name="imp-mode" id="imp-replace" value="replace"> Replace everything here</label></div>
    <div class="actions"><button class="btn primary" type="button" data-act="import">Import</button></div>
    <p class="status-msg" id="imp-msg" hidden></p>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px"><h3>Start over</h3>
    <p class="muted" style="margin:0;font-size:.9rem">Erase all equipment and service records on this device. Make a backup first if you might want them later.</p>
    <div class="actions"><button class="btn danger" type="button" data-act="erase-all">Erase all data</button></div>
  </section>`);
}
function msg(id,text,good){const m=$('#'+id);m.textContent=text;m.className='status-msg '+(good?'good':'badmsg');m.hidden=false;}
function doImport(){
  const text=$('#imp-text').value.trim();
  if(!text){msg('imp-msg','Choose a backup file or paste backup text first.');return;}
  let data;
  try{data=JSON.parse(text);}catch(err){msg('imp-msg','That text isn\'t a valid backup. Paste the whole thing, starting with {');return;}
  if(!data||!Array.isArray(data.equipment)){msg('imp-msg','That file doesn\'t look like a Lawn Equipment Log backup.');return;}
  const inc=normalize(data);
  const mode=$('#imp-replace').checked?'replace':'merge';
  if(mode==='replace'){db={equipment:inc.equipment,logs:inc.logs,examples:false};}
  else{
    inc.equipment.forEach(e=>{const i=db.equipment.findIndex(x=>x.id===e.id);if(i>=0)db.equipment[i]=e;else db.equipment.push(e);});
    inc.logs.forEach(l=>{const i=db.logs.findIndex(x=>x.id===l.id);if(i>=0)db.logs[i]=l;else db.logs.push(l);});
  }
  save();render();
  msg('imp-msg',`Imported ${inc.equipment.length} equipment and ${inc.logs.length} service records (${mode==='replace'?'replaced':'merged'}).`,true);
  $('#exp-text').value=backupJSON();
}

/* ---------- events ---------- */
let armed=null;
function arm(btn,label,fn){
  if(armed&&armed.btn===btn){clearTimeout(armed.t);armed=null;fn();return;}
  if(armed){armed.btn.classList.remove('armed');armed.btn.textContent=armed.old;clearTimeout(armed.t);}
  const old=btn.textContent;btn.classList.add('armed');btn.textContent=label;
  armed={btn,old,t:setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old;armed=null;},4000)};
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],[data-open],[data-type],[data-del-log]');
  if(ev.target===$('#backdrop')){closeSheet();return;}
  if(!t) return;
  if(t.dataset.open){view.mode='detail';view.id=t.dataset.open;render();window.scrollTo(0,0);return;}
  if(t.dataset.type){view.type=t.dataset.type;renderList();return;}
  if(t.dataset.delLog){arm(t,'Tap again to delete',()=>{db.logs=db.logs.filter(l=>l.id!==t.dataset.delLog);save();render();});return;}
  const e=db.equipment.find(x=>x.id===view.id);
  switch(t.dataset.act){
    case 'add': equipForm(null);break;
    case 'back': view.mode='list';render();break;
    case 'edit': equipForm(e);break;
    case 'log': logForm(e);break;
    case 'del-eq': arm(t,'Tap again to delete',()=>{db.equipment=db.equipment.filter(x=>x.id!==e.id);db.logs=db.logs.filter(l=>l.equipId!==e.id);save();view.mode='list';render();});break;
    case 'close': closeSheet();break;
    case 'clear-ex': db.equipment=db.equipment.filter(x=>!x.ex);db.logs=db.logs.filter(l=>!l.ex);db.examples=false;save();view.mode='list';render();break;
    case 'iv-add': $('#iv-list').insertAdjacentHTML('beforeend',ivRow({}));$('#iv-list').lastElementChild.querySelector('input').focus();break;
    case 'iv-del': t.closest('.iv-row').remove();break;
    case 'iv-template':{
      const list=$('#iv-list');const have=new Set([...list.querySelectorAll('.iv-task')].map(i=>i.value.trim().toLowerCase()));
      template($('#f-type').value,$('#f-meter').checked).forEach(([task,h,d])=>{if(!have.has(task.toLowerCase()))list.insertAdjacentHTML('beforeend',ivRow({task,everyHours:h,everyDays:d}));});
      break;}
    case 'download':{
      const fname=`lawn-equipment-backup-${todayStr()}.json`;
      if(dl){dl.save({filename:fname,data:backupJSON()}).then(()=>msg('exp-msg','Backup file saved.',true),err=>{
        if(err&&err.code==='declined')msg('exp-msg','Download canceled.');else msg('exp-msg','Downloads aren\'t available here. Use Copy backup text instead.');});break;}
      try{const blob=new Blob([backupJSON()],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');
        a.href=url;a.download=`lawn-equipment-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
        msg('exp-msg','If no file appeared, this view blocks downloads. Use Copy backup text instead.',true);}
      catch(err){msg('exp-msg','Downloads are blocked here. Use Copy backup text instead.');}
      break;}
    case 'copy':{
      const ta=$('#exp-text');ta.value=backupJSON();
      const fallback=()=>{ta.focus();ta.select();msg('exp-msg','Text selected. Copy it with your device\'s copy command.');};
      try{navigator.clipboard.writeText(ta.value).then(()=>msg('exp-msg','Backup copied. Paste it somewhere safe.',true),fallback);}catch(err){fallback();}
      break;}
    case 'import': doImport();break;
    case 'erase-all': arm(t,'Tap again to erase everything',()=>{db={equipment:[],logs:[],examples:false};save();view.mode='list';view.q='';view.type='All';closeSheet();render();});break;
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==='eq-form') saveEquip(f);
  else if(f.id==='log-form') saveLog(f);
  else if(f.id==='hours-form'){const e=db.equipment.find(x=>x.id===view.id);const h=num($('#quick-hours').value);if(h!=null){e.hours=h;e.hoursUpdated=todayStr();save();render();}}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='search'){view.q=ev.target.value;const pos=ev.target.selectionStart;renderList();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos);}catch(e){}}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='f-meter'){$('#eq-form').classList.toggle('nometer',!ev.target.checked);$('#iv-hint').textContent=ivHint(ev.target.checked);}
  if(ev.target.id==='f-type'&&$('#eq-form').dataset.isNew){
    const meter=!NO_METER.includes(ev.target.value);$('#f-meter').checked=meter;$('#eq-form').classList.toggle('nometer',!meter);$('#iv-hint').textContent=ivHint(meter);
    $('#iv-list').innerHTML=template(ev.target.value,meter).map(([task,h,d])=>ivRow({task,everyHours:h,everyDays:d})).join('');
  }
  if(ev.target.id==='imp-file'){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{$('#imp-text').value=r.result;msg('imp-msg',`Loaded ${file.name}. Choose merge or replace, then Import.`,true);};r.onerror=()=>msg('imp-msg','Couldn\'t read that file. Try pasting its text instead.');r.readAsText(file);}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#backdrop').hidden)closeSheet();});
$('#btn-add').addEventListener('click',()=>equipForm(null));
$('#btn-backup').addEventListener('click',backupSheet);

let dl=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dl=d;},()=>{});}catch(e){}
if(!load()){seed();save();}
try{var mv=document.querySelector('meta[name="app-version"]');if(mv&&mv.content)$('#appVersion').textContent='v'+mv.content}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
render();
})();
</script>
